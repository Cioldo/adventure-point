<meta property="og:description" content="Finn aktiviteter i nærheten, book på sekunder og samle poeng du kan bruke på gratis opplevelser. Klikkbar demo.">

<body>
<title>Adventure Point</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone-width column (max 440px) with sticky top bar, scrolling view, fixed bottom tab bar and a bottom sheet for detail/booking. Single deliberate dark look taken from the 2022 Adobe XD prototype (navy + sky blue), with gold reserved for points. */
:root{
  --bg:#0d1830;
  --surface:#15244a;
  --surface-2:#1c2f5e;
  --line:rgba(150,180,255,.16);
  --ink:#eef3ff;
  --muted:#9db0d8;
  --sky:#3d9bff;
  --sky-ink:#06162f;
  --gold:#ffc84a;
  --good:#3fd6a0;
  --warn:#ff8a65;
  --water:#3a8fd6;
  --land:#1f3466;
  --land-2:#26407a;
  --font-display:"Fraunces", "Iowan Old Style", Georgia, serif;
  --font-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:8px}
.app{max-width:440px;margin:0 auto;min-height:100%;position:relative;background:var(--bg);box-shadow:0 0 0 1px var(--line)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:var(--gutter-l);padding-right:var(--gutter-r);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:6px;font-family:var(--font-display);font-weight:300;font-size:22px;letter-spacing:.01em;line-height:1}
.logo small{display:block;font-size:11px;font-style:italic;margin-top:2px;margin-left:44px;color:var(--muted)}
.logo svg{width:24px;height:24px;color:var(--ink)}
.top .spacer{flex:1}
.pts-pill{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;padding:6px 10px 6px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.pts-pill .coin{width:16px;height:16px;border-radius:50%;background:var(--gold);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:linear-gradient(135deg,#ffb35c,#e0607e);color:#2a0e19}

main{padding-block:16px 110px;padding-left:var(--gutter-l);padding-right:var(--gutter-r);display:flex;flex-direction:column;gap:20px}

/* type */
h1,h2,h3{margin:0;text-wrap:balance}
.h1{font-family:var(--font-display);font-weight:500;font-size:26px;line-height:1.15}
.h2{font-size:19px;font-weight:700}
.sub{color:var(--muted);margin:2px 0 0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* search + chips */
.search{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--sky-ink);border-radius:999px;padding:10px 16px}
.search svg{width:18px;height:18px;flex:none}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--sky-ink);font-weight:500}
.search input::placeholder{color:#5a6b8f}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--sky);color:var(--sky-ink);border-color:var(--sky)}
.chip.light{background:var(--ink);color:var(--sky-ink);border-color:var(--ink)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:18px;min-height:168px;display:flex;align-items:flex-end;justify-content:flex-end;padding:16px;text-align:left;width:100%;
  background:linear-gradient(180deg,#f2a65a 0%,#e9774f 38%,#8a3f5c 70%,#2d2a5a 100%)}
.hero svg.scene{position:absolute;inset:0;width:100%;height:100%}
.hero .bubble{position:relative;background:var(--bg);border-radius:28px;padding:12px 18px;max-width:220px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.hero .bubble b{display:block;font-family:var(--font-display);font-weight:500;font-size:20px;line-height:1.15}
.hero .bubble span{font-size:12px;font-weight:700;color:var(--muted)}

/* activity card (pill-over-image, as in prototype) */
.list{display:flex;flex-direction:column;gap:12px}
.card{position:relative;display:block;width:100%;height:132px;border-radius:14px;overflow:hidden;text-align:left;background:var(--surface)}
.card .art{position:absolute;inset:0}
.card .label{position:absolute;left:12px;top:12px;background:var(--bg);border-radius:22px;padding:8px 16px 9px;min-width:170px;max-width:calc(100% - 24px);box-shadow:0 6px 18px rgba(0,0,0,.3)}
.card .label b{display:block;font-size:17px;font-weight:600;line-height:1.2}
.card .label .row{display:flex;justify-content:space-between;gap:16px;font-size:11.5px;font-weight:700;margin-top:2px}
.card .label .row span:last-child{color:var(--gold)}
.card .label .row span.none{color:var(--muted);font-weight:600}
.card .go{position:absolute;right:12px;bottom:10px;width:26px;height:26px;color:#fff}
.card .meta{position:absolute;left:12px;bottom:10px;display:flex;gap:6px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(6,16,40,.72);color:var(--ink);backdrop-filter:blur(4px)}
.tag.gold{color:var(--gold)}
.tag.new{background:var(--good);color:#04261a}

.art{background:linear-gradient(135deg,var(--a),var(--b))}
.art svg{position:absolute;right:-6%;top:50%;transform:translateY(-50%);height:130%;width:auto;color:rgba(255,255,255,.28);stroke-width:5;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,16,36,.18) 0%,rgba(8,16,36,0) 40%,rgba(8,16,36,.55) 100%)}
.photo{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .5s ease}
.card:hover .photo{transform:scale(1.04)}
.hero .photo{z-index:0}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,16,36,0) 30%,rgba(8,16,36,.45));z-index:0}
.hero .bubble{z-index:1}
.credit{margin:0;font-size:11.5px;color:var(--muted);line-height:1.4}
.credit a{color:var(--muted);text-decoration:underline}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.status.on{color:var(--good)}
.status.on i{background:var(--good);box-shadow:0 0 0 3px rgba(63,214,160,.2)}
.tag.open{background:rgba(63,214,160,.9);color:#04261a}
.tag.illus{background:rgba(6,16,40,.55);color:var(--muted);font-weight:600}
.greet{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.greet small{display:block;color:var(--muted);font-size:13px;font-weight:600}
.greet b{font-family:var(--font-display);font-weight:500;font-size:24px;line-height:1.1}
.wx{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.wx svg{width:12px;height:12px;vertical-align:-1px}
.credits-list{display:flex;flex-direction:column;gap:10px}
.cr{display:flex;gap:10px;align-items:center}
.cr .art{position:relative;width:56px;height:42px;border-radius:8px;overflow:hidden;flex:none}
.cr div:last-child{min-width:0;font-size:12.5px;color:var(--muted)}
.cr b{display:block;color:var(--ink);font-size:13.5px}
.cr a{color:var(--sky)}

.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:999px;font-weight:700;background:var(--ink);color:var(--sky-ink);text-align:center}
.btn.sky{background:var(--sky);color:var(--sky-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#2d1d00}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}

/* explore filters */
.filters{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.f-head{display:flex;align-items:center;gap:8px;color:var(--sky);font-weight:700;font-size:14px}
.f-head svg{width:18px;height:18px}
.range{position:relative;height:28px;margin:0 6px}
.range .track{position:absolute;left:0;right:0;top:13px;height:3px;border-radius:2px;background:var(--line)}
.range .fill{position:absolute;top:13px;height:3px;background:var(--sky)}
.range input{position:absolute;inset:0;width:100%;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.range input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:22px;height:22px;border-radius:50%;background:var(--ink);border:4px solid var(--sky);cursor:grab}
.range input::-moz-range-thumb{pointer-events:auto;width:16px;height:16px;border-radius:50%;background:var(--ink);border:4px solid var(--sky);cursor:grab}
.range-vals{display:flex;justify-content:space-between;color:var(--sky);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.f-grid{display:grid;grid-template-columns:1.2fr 1fr .8fr;gap:8px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--sky)}
.field input,.field select{width:100%;min-width:0;background:var(--ink);color:var(--sky-ink);border:0;border-radius:8px;padding:9px 8px;font-weight:600;font-size:13.5px;color-scheme:light}
.toggle{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600}
.toggle input{width:18px;height:18px;accent-color:var(--sky)}
.results-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.results-head select{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:13px;font-weight:600}
.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1px dashed var(--line);border-radius:14px}

/* map */
.map-wrap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--water)}
.map-wrap svg{display:block;width:100%;height:auto}
.pin{cursor:pointer}
.pin path{fill:var(--sky);stroke:#06162f;stroke-width:1.5}
.pin.sel path{fill:#ff5a6e}
.pin.gold path{fill:var(--gold)}
.map-card{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:10px;align-items:stretch;background:var(--bg);border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4);text-align:left}
.map-card .txt{flex:1;min-width:0;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.map-card .art{position:relative;width:38%;flex:none}
.map-card .art svg{right:-10%}
.stars{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.stars svg{width:15px;height:15px;color:var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

/* points */
.balance{position:relative;overflow:hidden;border-radius:18px;padding:18px;background:linear-gradient(140deg,#20386f,#13234a 60%);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.balance .num{font-family:var(--font-display);font-weight:500;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;color:var(--gold)}
.balance .num small{font-family:var(--font-body);font-size:15px;font-weight:700;color:var(--ink);margin-left:6px}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffe08f);border-radius:inherit}
.lvl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600}
.lvl b{color:var(--ink)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)}
.step b{color:var(--ink);font-size:13.5px}
.step .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--sky);color:var(--sky-ink);font-weight:800;font-size:12px}
.cost{color:var(--gold)}
.lock{color:var(--muted)}
.history{display:flex;flex-direction:column}
.h-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.h-row:last-child{border-bottom:0}
.h-row small{display:block;color:var(--muted);font-size:12px}
.h-row .p{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.h-row .p.plus{color:var(--good)}
.h-row .p.minus{color:var(--warn)}

/* bookings */
.bk{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.bk .art{position:relative;width:62px;height:62px;border-radius:10px;flex:none;overflow:hidden}
.bk .art svg{right:-30%}
.bk .txt{flex:1;min-width:0}
.bk .txt b{display:block}
.bk .txt small{color:var(--muted);font-size:12.5px}
.bk .btn{padding:8px 14px;font-size:13px}
.done-badge{font-size:12px;font-weight:700;color:var(--good);white-space:nowrap}

/* profile */
.prof{display:flex;align-items:center;gap:14px}
.prof .avatar{width:58px;height:58px;font-size:22px}
.menu{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.menu button{display:flex;align-items:center;gap:12px;padding:14px;text-align:left;border-bottom:1px solid var(--line);font-weight:600}
.menu button:last-child{border-bottom:0}
.menu button svg{width:20px;height:20px;color:var(--sky);flex:none}
.menu button span{flex:1}
.menu button small{color:var(--muted);font-weight:500}
.demo-note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--sky);padding:4px 0 4px 10px}

/* tabs */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);z-index:25;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(13,24,48,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(4px, env(safe-area-inset-left, 0px));padding-right:max(4px, env(safe-area-inset-right, 0px))}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--sky)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(3,8,20,.62);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{width:min(440px,100%);max-height:92%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;border-top:1px solid var(--line);animation:up .24s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .art.big{position:relative;height:180px}
.sheet .art.big svg{height:120%}
.sheet-body{display:flex;flex-direction:column;gap:16px;padding-block:16px 0;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(6,16,40,.7);color:var(--ink);z-index:2}
.x svg{width:18px;height:18px}
.sheet-top{position:relative}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.fact small{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.fact b{font-size:15px;font-variant-numeric:tabular-nums}
.fact b.gold{color:var(--gold)}
.desc{margin:0;color:#cfdaf3;max-width:65ch}
.partner{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);background:var(--surface);border-radius:12px;padding:10px 12px}
.partner b{color:var(--ink)}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;text-align:center}
.slot small{display:block;font-weight:600;color:var(--muted);font-size:11px}
.slot[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:var(--sky-ink)}
.slot[aria-pressed="true"] small{color:var(--sky-ink)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:20px;font-weight:700;display:grid;place-items:center}
.stepper b{font-size:20px;min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.pay{display:grid;gap:8px}
.pay label{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.pay label:has(input:checked){border-color:var(--sky)}
.pay label.off{opacity:.5}
.pay input{accent-color:var(--sky);width:18px;height:18px}
.pay label span{flex:1}
.pay label small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:12px}
.total b{font-size:22px;font-variant-numeric:tabular-nums}
.big-ok{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:10px 0}
.big-ok .ring{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:rgba(63,214,160,.15);color:var(--good)}
.big-ok .ring svg{width:38px;height:38px}
.qr{background:#fff;border-radius:14px;padding:14px;width:200px;margin:0 auto}
.qr svg{display:block;width:100%;height:auto}
.code{font-family:ui-monospace,Consolas,monospace;font-weight:700;letter-spacing:.2em;text-align:center;font-size:18px}
.tiers{display:grid;gap:10px}
.tier{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.tier.hl{border-color:var(--gold)}
.tier .t-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tier .t-top b{font-size:16px}
.tier .t-top span{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.tier p{margin:0;font-size:13px;color:var(--muted)}
.calc{display:flex;flex-direction:column;gap:8px}
.calc input[type=range]{width:100%;accent-color:var(--sky)}
.calc-table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.calc-table td{padding:7px 0;border-bottom:1px solid var(--line)}
.calc-table td:last-child{text-align:right;font-weight:700}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--sky-ink);font-weight:700;padding:10px 18px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center;animation:up .2s ease}
.toast.gold{background:var(--gold);color:#2d1d00}

@keyframes up{from{transform:translateY(24px);opacity:0}}
.toast{animation-name:toastIn}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:370px){.f-grid{grid-template-columns:1fr 1fr}.f-grid .field:first-child{grid-column:1/-1}.steps{grid-template-columns:1fr}}

  return `${ILLUS.has(key) ? 'Illustrasjonsfoto, ikke fra stedet. ' : ''}Foto: ${esc(c[0])} · ${c[1]} · <a href="${c[2]}" target="_blank" rel="noopener">Wikimedia Commons</a>`;

function openStatus(a){
  if (a.price===0 && !OPEN[a.id]) return {txt:'Alltid åpent', on:true};
  const o = OPEN[a.id]; if (!o) return null;
  const now = new Date(), h = now.getHours() + now.getMinutes()/60;
  if ((a.closed||[]).includes(now.getDay())) return {txt:'Stengt i dag', on:false};
  if (h < o[0]) return {txt:`Åpner kl. ${o[0]}:00`, on:false};
  if (h < o[1]) return {txt:`Åpent nå · stenger ${o[1]}:00`, on:true};
  return {txt:'Stengt for i dag', on:false};
}

/* ---------- pieces ---------- */
const ptsLabel = a => a.level === 1 ? '<span class="none">Ingen poeng</span>' : `<span>Få ${a.earn} poeng</span>`;
function card(a, opts={}){
  const tags = [];
  if (a.isNew) tags.push('<span class="tag new">Ny</span>');
  if (a.redeem) tags.push(`<span class="tag gold">Bruk ${pt(a.redeem)} p</span>`);
  if (opts.price) tags.push(`<span class="tag">${priceTxt(a)}</span>`);
  const st = openStatus(a); if (st && st.on) tags.push(`<span class="tag open">${st.txt.split(' · ')[0]}</span>`);
  if (ILLUS.has(a.id)) tags.push('<span class="tag illus">Illustrasjon</span>');
  if (opts.dist) tags.push(`<span class="tag">${dist(a).toFixed(1).replace('.',',')} km</span>`);
  const right = opts.cost ? `<span>Pris ${pt(a.redeem)} poeng</span>` : ptsLabel(a);
  return `<button class="card" data-act="open" data-id="${a.id}" aria-label="${esc(a.name)}, ${esc(a.place)}">
    <div class="art" style="--a:${a.a};--b:${a.b}">${photo(a.id)}</div>
    <div class="label"><b>${esc(a.name)}</b><div class="row"><span>${esc(a.place)}</span>${right}</div></div>
    <div class="meta">${tags.join('')}</div>
    ${ic('arrow','go')}
  </button>`;
}
function levelInfo(){
  let i = 0; while (i < LEVELS.length-1 && S.earned >= LEVELS[i+1].min) i++;
  const cur = LEVELS[i], next = LEVELS[i+1];
  const pct = next ? Math.min(100, (S.earned-cur.min)/(next.min-cur.min)*100) : 100;
  return {cur, next, pct};
}

const inWindow = (t, w) => { const h = +t.slice(0,2); return w==='alle' || (w==='form'&&h>=9&&h<12) || (w==='etter'&&h>=12&&h<17) || (w==='kveld'&&h>=17&&h<23); };
function filtered(){
  const q = F.q.trim().toLowerCase();
  let r = ACTS.filter(a =>
    (F.cat==='Alle' || a.cat===F.cat) &&
    (a.price===null ? F.min===0 : a.price >= F.min && (F.max>=1500 || a.price <= F.max)) &&
    (!q || (a.name+' '+a.place+' '+a.cat).toLowerCase().includes(q)) &&
    (!F.date || !a.date || a.date===F.date) &&
    a.times.some(t => inWindow(t, F.time)) &&
    (!F.onlyRedeem || a.redeem) && (!F.onlyNew || a.isNew));
  const s = {naer:(a,b)=>dist(a)-dist(b), pris:(a,b)=>(a.price??1e9)-(b.price??1e9), poeng:(a,b)=>b.earn-a.earn, navn:(a,b)=>a.name.localeCompare(b.name,'nb')}[F.sort];
  return r.sort(s);
}
function updateResults(){
  const r = filtered();
  const fill = document.getElementById('rfill');
  if (fill){ fill.style.left = (F.min/1500*100)+'%'; fill.style.right = (100-F.max/1500*100)+'%'; }
  const vmin = document.getElementById('vmin'), vmax = document.getElementById('vmax');
  if (vmin){ vmin.textContent = kr(F.min); vmax.textContent = F.max>=1500 ? '1 500 kr +' : kr(F.max); }
  document.getElementById('count').textContent = `${r.length} ${r.length===1?'aktivitet':'aktiviteter'}`;
  document.getElementById('results').innerHTML = r.length
    ? r.map(a => card(a,{price:true,dist:F.sort==='naer'})).join('')
    : `<div class="empty">Ingen aktiviteter passer filtrene.<br><button class="btn ghost" style="margin-top:12px" data-act="clearF">Nullstill filtrene</button></div>`;
}

  ${done.length ? `<section class="list"><h2 class="h2">Fullført</h2>${done.slice().reverse().map(bookingRow).join('')}</section>` : ''}
  <div class="menu">
    <button data-act="contest">${ic('trophy')}<span>Konkurransen om 20 000 poeng<br><small>Du har ${S.tickets} ${S.tickets===1?'lodd':'lodd'}</small></span>${ic('arrow')}</button>
    <button data-act="biz">${ic('shop')}<span>For bedrifter<br><small>Bli partner og nå flere lokale kunder</small></span>${ic('arrow')}</button>
    <button data-act="credits">${ic('star')}<span>Bildekreditering<br><small>Fotografer og lisenser fra Wikimedia Commons</small></span>${ic('arrow')}</button>
    <button data-act="reset">${ic('reset')}<span>${ui.resetArm ? 'Trykk igjen for å nullstille' : 'Nullstill testkontoen'}<br><small>Tilbake til 1 015 poeng og 2 240 demo-kr</small></span></button>
  </div>
  <p class="demo-note">Dette er en klikkbar demo av Adventure Point (BED-2015, våren 2022). Stedene, adressene og prisene er ekte og hentet fra visittromso.no i november 2026, så sjekk alltid hos bedriften. Testkontoen, demo-kronene, poengene og partnernivåene er oppdiktet. Ingen av bedriftene er partnere, ingen booking sendes, og alt lagres bare i denne nettleseren.</p>`;
}

/* ---------- sheet contents ---------- */
function sDetail(a){
  const pointsFact = a.level===1 ? '<b>–</b>' : `<b class="gold">+${a.earn}</b>`;
  const partner = a.level===3 ? `Partner på <b>nivå 3</b>. Du får poeng her og kan også betale med poeng (${pt(a.redeem)} poeng per person).`
    : a.level===2 ? `Partner på <b>nivå 2</b>. Du får ${a.earn} poeng når du sjekker inn, men kan ikke betale med poeng her.`
    : `Gratis oppføring (<b>nivå 1</b>). Du kan booke, men får ingen poeng her.`;
  return `<div class="sheet-top"><div class="art big" style="--a:${a.a};--b:${a.b}">${photo(a.id)}</div><button class="x" data-act="close" aria-label="Lukk">${ic('close')}</button></div>
  <div class="sheet-body">
    <p class="credit" style="margin-top:-6px">${credit(a.id)}</p>
    <div><span class="eyebrow">${esc(a.cat)} · ${esc(a.place)} · ${dist(a).toFixed(1).replace('.',',')} km</span><h2 class="h1" style="margin-top:4px">${esc(a.name)}</h2>
      <div class="stars" style="margin-top:4px">${ic('map')} ${esc(a.addr)}</div>
      ${(() => { const st = openStatus(a); return st ? `<div class="status ${st.on?'on':''}" style="margin-top:6px"><i></i>${st.txt}</div>` : ''; })()}</div>
    <div class="facts"><div class="fact"><small>Pris</small><b>${priceTxt(a)}</b></div><div class="fact"><small>Varighet</small><b>${a.dur}</b></div><div class="fact"><small>Poeng</small>${pointsFact}</div></div>
    <p class="desc">${esc(a.desc)}</p>
    <p class="demo-note" style="margin:0">${esc(a.priceNote)}${a.src ? ` Kilde: <a href="${a.src}" target="_blank" rel="noopener" style="color:var(--sky)">${a.src.replace(/^https:\/\/(www\.)?/,'').split('/')[0]}</a>.` : ''}</p>
    <div class="partner">${ic('shop')}<span>${partner} <i>Partnernivå og poeng er fiktive i demoen.</i></span></div>
    <button class="btn sky block" data-act="book" data-id="${a.id}">${a.price===0 ? 'Legg i planen' : 'Book nå'}</button>
  </div>`;
}
function bookDates(a){
  if (a.date) return [new Date(a.date+'T00:00')];
  return Array.from({length:10},(_,i)=>addDays(i)).filter(d => !(a.closed||[]).includes(d.getDay())).slice(0,7);
}
const defaultPay = a => a.price===0 ? 'gratis' : a.price===null ? 'sted' : 'lommebok';
function sBook(){
  const a = byId(draft.actId);
  const dates = bookDates(a);
  const cash = (a.price||0)*draft.persons, cost = (a.redeem||0)*draft.persons;
  const canRedeem = a.redeem && S.points >= cost;
  const canWallet = S.wallet >= cash;
  if (draft.paid==='poeng' && !canRedeem) draft.paid = defaultPay(a);
  const earnTxt = a.level===1 ? 'Gir ingen poeng her' : `Du får ${a.earn} poeng når du sjekker inn`;
  let payHtml;
  if (a.price===0) payHtml = `<label><input type="radio" name="pay" value="gratis" checked><span>Gratis<small>Ingen betaling. Lagres i planen din.</small></span><b>0 kr</b></label>`;
  else if (a.price===null) payHtml = `<label><input type="radio" name="pay" value="sted" checked><span>Betal på stedet<small>Kilden oppgir ikke pris. ${earnTxt}.</small></span><b>–</b></label>`;
  else payHtml = `<label class="${canWallet?'':'off'}"><input type="radio" name="pay" value="lommebok" ${draft.paid==='lommebok'?'checked':''} ${canWallet?'':'disabled'}><span>Demo-lommebok<small>${canWallet ? `Saldo ${kr(S.wallet)}. ${earnTxt}.` : `Du mangler ${kr(cash-S.wallet)}.`}</small></span><b>${kr(cash)}</b></label>
      ${canWallet ? '' : `<button class="btn ghost" data-act="topup" data-back="book">Fyll på 1 000 demo-kr</button>`}`;
  if (a.redeem) payHtml += `<label class="${canRedeem?'':'off'}"><input type="radio" name="pay" value="poeng" ${draft.paid==='poeng'?'checked':''} ${canRedeem?'':'disabled'}><span>Betal med poeng<small>${canRedeem?`Du har ${pt(S.points)} poeng`:`Du mangler ${pt(cost-S.points)} poeng`}</small></span><b class="cost">${pt(cost)} p</b></label>`;
  const totalTxt = draft.paid==='poeng' ? `<span class="cost">${pt(cost)} poeng</span>` : a.price===null ? 'På stedet' : kr(cash);
  const ready = draft.time && (draft.paid!=='lommebok' || canWallet);
  return `<div class="sheet-body" style="padding-top:20px">
    <div style="display:flex;align-items:center;gap:10px"><button class="x" style="position:static" data-act="open" data-id="${a.id}" aria-label="Tilbake">${ic('back')}</button><div><span class="eyebrow">Booking</span><h2 class="h2">${esc(a.name)} · ${esc(a.place)}</h2></div></div>
    <div><div class="f-head" style="margin-bottom:8px">${ic('cal')} Dato</div>
      <div class="slots">${dates.map((d,i)=>`<button class="slot" data-act="date" data-i="${i}" aria-pressed="${draft.dateIdx===i}">${d.toLocaleDateString('nb-NO',{weekday:'short'})}<small>${d.getDate()}. ${d.toLocaleDateString('nb-NO',{month:'short'})}</small></button>`).join('')}</div></div>
    <div><div class="f-head" style="margin-bottom:8px">${ic('clock')} Klokkeslett</div>
      <div class="slots">${a.times.map(t=>`<button class="slot" data-act="slot" data-t="${t}" aria-pressed="${draft.time===t}">${t}</button>`).join('')}</div></div>
    <div><div class="f-head" style="margin-bottom:8px">${ic('people')} Antall personer</div>
      <div class="stepper"><button data-act="pminus" aria-label="Færre">−</button><b>${draft.persons}</b><button data-act="pplus" aria-label="Flere">+</button></div></div>
    <div class="pay" role="radiogroup" aria-label="Betaling">${payHtml}</div>
    <div class="total"><span>Å betale</span><b>${totalTxt}</b></div>
    <button class="btn sky block" data-act="confirm" ${ready?'':'disabled'}>${!draft.time ? 'Velg et klokkeslett' : ready ? (a.price===0 ? 'Legg i planen' : 'Bekreft booking') : 'Fyll på lommeboka først'}</button>
    <p class="demo-note" style="margin:0">Demo-kroner er ikke ekte penger, og bedriften får ingen booking.</p>
  </div>`;
}
function sConfirm(b){
  const a = byId(b.actId);
  return `<div class="sheet-body" style="padding-top:24px">
    <div class="big-ok"><div class="ring">${ic('check')}</div><h2 class="h1">Booket!</h2>
      <p class="sub">${esc(a.name)} · ${fmtDay(new Date(b.date+'T00:00'))} kl. ${b.time} · ${b.persons} ${b.persons===1?'person':'personer'}</p>
      <p class="desc" style="text-align:center">${b.paid==='poeng' ? `Vi har trukket ${pt(a.redeem*b.persons)} poeng. Vis koden din når du kommer.`
        : b.paid==='lommebok' ? `Vi har trukket ${kr(b.amount)} fra demo-lommeboka.${a.level>1 ? ` Sjekk inn når du kommer, så får du <b class="cost">${a.earn} poeng</b> og ett lodd.` : ''}`
        : b.paid==='sted' ? `Du betaler hos ${esc(a.name)}. Sjekk inn når du kommer, så får du <b class="cost">${a.earn} poeng</b> og ett lodd.`
        : 'Lagt i planen din. Dette stedet gir ingen poeng.'}</p></div>
    <button class="btn sky block" data-act="checkin" data-bid="${b.bid}">${ic('qr')} Vis innsjekkingskode</button>
    <button class="btn ghost block" data-act="close">Ferdig</button>
  </div>`;
}
function qrSvg(seedStr){
  let h = 2166136261; for (const c of seedStr) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  const rnd = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return (h >>> 0) / 4294967296; };
  const N = 25; let r = '';
  const finder = (x,y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#06162f"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#06162f"/>`;
  const inF = (x,y) => (x<8&&y<8)||(x>=N-8&&y<8)||(x<8&&y>=N-8);
  for (let y=0;y<N;y++) for (let x=0;x<N;x++) if (!inF(x,y) && rnd()>.52) r += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  return `<svg viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges" aria-hidden="true"><g fill="#06162f">${r}</g>${finder(0,0)}${finder(N-7,0)}${finder(0,N-7)}</svg>`;
}
function sCheckin(b){
  const a = byId(b.actId);
  const code = ('AP-' + b.bid.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(-4).padStart(4,'7') + '-' + a.id.slice(0,3).toUpperCase());
  return `<div class="sheet-top"><button class="x" data-act="close" aria-label="Lukk">${ic('close')}</button></div>
  <div class="sheet-body" style="padding-top:24px">
    <div style="text-align:center"><span class="eyebrow">Innsjekking</span><h2 class="h1" style="margin-top:4px">${esc(a.name)}</h2><p class="sub">Vis koden til de ansatte hos ${esc(a.place)}.</p></div>
    <div class="qr">${qrSvg(b.bid+a.id)}</div>
    <div class="code">${code}</div>
    <p class="demo-note">I demoen trykker du selv på knappen under. I den ferdige appen skanner bedriften koden i sin egen app.</p>
    <button class="btn gold block" data-act="scanned" data-bid="${b.bid}">${ic('check')} Bedriften har skannet koden</button>
  </div>`;
}
function sContest(){
  return `<div class="sheet-top"><button class="x" data-act="close" aria-label="Lukk">${ic('close')}</button></div>
  <div class="sheet-body" style="padding-top:24px">
    <span class="eyebrow">Konkurranse</span>
    <h2 class="h1">Vinn 20 000 poeng</h2>
    <p class="desc">Hver gang du sjekker inn hos en partnerbedrift får du ett lodd. Trekningen er 31. desember, og vinneren får 20 000 poeng. Det holder til flere gratisturer med Fjellheisen, Polaria eller kajakk på Sommarøy.</p>
    <p class="demo-note">Konkurransen finnes bare i demoen.</p>
    <div class="facts"><div class="fact"><small>Dine lodd</small><b class="gold">${S.tickets}</b></div><div class="fact"><small>Trekning</small><b>31. des.</b></div><div class="fact"><small>Premie</small><b>20 000 p</b></div></div>
    <button class="btn sky block" data-act="tab" data-tab="utforsk">Finn en aktivitet</button>
  </div>`;
}
function sCredits(){
  const rows = [['hero','Forsidebilde: Tromsø fra Storsteinen'], ...ACTS.map(a => [a.id, a.name])].filter(([k]) => CREDITS[k]);
  return `<div class="sheet-top"><button class="x" data-act="close" aria-label="Lukk">${ic('close')}</button></div>
  <div class="sheet-body" style="padding-top:24px">
    <span class="eyebrow">Bildekreditering</span>
    <h2 class="h1">Fotografene bak bildene</h2>
    <p class="desc">Alle bildene er hentet fra Wikimedia Commons og brukes etter lisensen som står oppført. Bilder merket «illustrasjon» er ikke tatt hos stedet de vises ved.</p>
    <div class="credits-list">${rows.map(([k, n]) => { const c = CREDITS[k]; return `<div class="cr"><div class="art">${photo(k)}</div><div><b>${esc(n)}${ILLUS.has(k)?' (illustrasjon)':''}</b>${esc(c[0])} · ${c[1]} · <a href="${c[2]}" target="_blank" rel="noopener">Kilde</a></div></div>`; }).join('')}</div>
  </div>`;
}
function sBiz(){
  return `<div class="sheet-top"><button class="x" data-act="close" aria-label="Lukk">${ic('close')}</button></div>
  <div class="sheet-body" style="padding-top:24px">
    <span class="eyebrow">For bedrifter</span>
    <h2 class="h1">Bli partner i Adventure Point</h2>
    <p class="desc">Lokale kunder finner, booker og kommer tilbake til deg. En del av partneravgiftene går tilbake til brukerne som gratisaktiviteter, og det gir flere besøk hos deg.</p>
    <div class="tiers">
      <div class="tier"><div class="t-top"><b>Nivå 1</b><span>Gratis</span></div><p>Du blir synlig i appen og kan ta imot bookinger. Brukerne får ingen poeng hos deg.</p></div>
      <div class="tier"><div class="t-top"><b>Nivå 2</b><span>1 000 kr + 2 %</span></div><p>Brukerne får poeng når de besøker deg, men kan ikke betale med poeng hos deg.</p></div>
      <div class="tier hl"><div class="t-top"><b>Nivå 3</b><span>5 000 kr + 3 %</span></div><p>Brukerne både får og bruker poeng hos deg. Du havner under «Bruk poeng», den mest besøkte siden for faste brukere.</p></div>
      <div class="tier"><div class="t-top"><b>Forsideplass</b><span>Budrunde</span></div><p>Hver sesong byr bedriftene på de fire plassene under «Aktiviteter i nærheten» på forsiden.</p></div>
    </div>
    <div class="calc">
      <label class="f-head" for="sales">${ic('tag')} Omsetning via appen per periode: <span id="salesV" style="color:var(--ink)"></span></label>
      <input type="range" id="sales" min="0" max="500000" step="10000" value="100000">
      <table class="calc-table"><tbody id="calcBody"></tbody></table>
    </div>
  </div>`;
}
function updateCalc(){
  const el = document.getElementById('sales'); if (!el) return;
  const v = +el.value;
  document.getElementById('salesV').textContent = kr(v);
  document.getElementById('calcBody').innerHTML =
    `<tr><td>Nivå 1</td><td>0 kr</td></tr><tr><td>Nivå 2 (1 000 kr + 2 %)</td><td>${kr(Math.round(1000+v*.02))}</td></tr><tr><td>Nivå 3 (5 000 kr + 3 %)</td><td>${kr(Math.round(5000+v*.03))}</td></tr>`;
}

/* ---------- render ---------- */
const TABS = [['hjem','Hjem','home'],['utforsk','Utforsk','compass'],['kart','Kart','map'],['poeng','Poeng','gift'],['profil','Profil','user']];
function render(){
  document.getElementById('ptsTop').textContent = pt(S.points);
  document.getElementById('tabs').innerHTML = TABS.map(([k,l,i]) => `<button data-act="tab" data-tab="${k}" ${ui.tab===k?'aria-current="page"':''}>${ic(i)}${l}</button>`).join('');
  const v = document.getElementById('view');
  v.innerHTML = {hjem:vHome, utforsk:vExplore, kart:vMap, poeng:vPoints, profil:vProfile}[ui.tab]();
  if (ui.tab==='utforsk') updateResults();
}
function go(tab){ ui.tab = tab; ui.resetArm = false; closeSheet(); render(); window.scrollTo(0,0); }

function openSheet(html){
  const root = document.getElementById('sheetRoot');
  const existing = root.querySelector('.sheet');
  if (existing){ existing.innerHTML = html; existing.scrollTop = 0; }
  else root.innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  document.body.style.overflow = 'hidden';
  updateCalc();
}
function closeSheet(){ document.getElementById('sheetRoot').innerHTML = ''; document.body.style.overflow = ''; }
let toastT;
function toast(msg, gold){
  const r = document.getElementById('toastRoot');
  r.innerHTML = `<div class="toast ${gold?'gold':''}" role="status">${msg}</div>`;
  clearTimeout(toastT); toastT = setTimeout(() => r.innerHTML = '', 2600);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  if (act==='scrim' && e.target!==t) return;
  switch (act){
    case 'tab': go(t.dataset.tab); break;
    case 'quick': Object.assign(F,{cat:t.dataset.cat,onlyNew:false}); go('utforsk'); break;
    case 'newOnly': Object.assign(F,{onlyNew:true,cat:'Alle'}); go('utforsk'); break;
    case 'cat': F.cat = t.dataset.cat; document.querySelectorAll('#catChips .chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.cat===F.cat)); updateResults(); break;
    case 'clearF': Object.assign(F,{q:'',cat:'Alle',min:0,max:1500,date:'',time:'alle',onlyRedeem:false,onlyNew:false}); render(); break;
    case 'open': openSheet(sDetail(byId(t.dataset.id))); break;
    case 'pin': ui.mapSel = t.dataset.id; render(); break;
    case 'close': case 'scrim': closeSheet(); break;
    case 'book': {
      const a = byId(t.dataset.id);
      draft = {actId:a.id, dateIdx:0, time:a.times.length===1 ? a.times[0] : null, persons:Math.max(1, Math.min(F.persons, 10)), paid:defaultPay(a)};
      openSheet(sBook()); break; }
    case 'date': draft.dateIdx = +t.dataset.i; openSheet(sBook()); break;
    case 'slot': draft.time = t.dataset.t; openSheet(sBook()); break;
    case 'pminus': draft.persons = Math.max(1, draft.persons-1); openSheet(sBook()); break;
    case 'pplus': draft.persons = Math.min(20, draft.persons+1); openSheet(sBook()); break;
    case 'confirm': {
      const a = byId(draft.actId);
      const d = bookDates(a)[draft.dateIdx];
      const b = {bid:'b'+Date.now().toString(36), actId:a.id, date:iso(d), time:draft.time, persons:draft.persons, paid:draft.paid, amount:0, status:'kommende'};
      if (b.paid==='poeng'){ const cost = a.redeem*b.persons; S.points -= cost; S.history.push({d:iso(today), text:`${a.name} · betalt med poeng`, p:-cost}); }
      if (b.paid==='lommebok'){ b.amount = a.price*b.persons; if (b.amount > S.wallet) break; S.wallet -= b.amount; S.tx.push({d:iso(today), text:`${a.name} · ${b.persons} ${b.persons===1?'person':'personer'}`, k:-b.amount}); }
      S.bookings.push(b); save(); render(); openSheet(sConfirm(b)); break; }
    case 'checkin': { const b = S.bookings.find(x => x.bid===t.dataset.bid); if (b) openSheet(sCheckin(b)); break; }
    case 'scanned': {
      const b = S.bookings.find(x => x.bid===t.dataset.bid); if (!b || b.status!=='kommende') { closeSheet(); break; }
      const a = byId(b.actId); b.status = 'fullført';
      let msg = 'Sjekket inn';
      if (b.paid!=='poeng' && a.level>1){ S.points += a.earn; S.earned += a.earn; S.tickets += 1; S.history.push({d:iso(today), text:`${a.name} · ${a.place}`, p:a.earn}); msg = `+${a.earn} poeng og ett lodd`; }
      save(); closeSheet(); render(); toast(msg, true); break; }
    case 'topup':
      S.wallet += 1000; S.tx.push({d:iso(today), text:'Påfylling av demo-kroner', k:1000}); save();
      if (t.dataset.back==='book' && draft) openSheet(sBook()); else render();
      document.getElementById('ptsTop').textContent = pt(S.points);
      toast('+1 000 demo-kr'); break;
    case 'contest': openSheet(sContest()); break;
    case 'credits': openSheet(sCredits()); break;
    case 'biz': openSheet(sBiz()); break;
    case 'reset':
      if (!ui.resetArm){ ui.resetArm = true; render(); break; }
      S = seed(); save(); ui.resetArm = false; render(); toast('Demoen er nullstilt'); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key==='Escape') closeSheet();
  if ((e.key==='Enter'||e.key===' ') && e.target.matches('.pin')){ e.preventDefault(); ui.mapSel = e.target.dataset.id; render(); }
});
document.addEventListener('submit', e => {
  if (e.target.id==='homeSearch'){ e.preventDefault(); F.q = document.getElementById('homeQ').value; go('utforsk'); const q = document.getElementById('fq'); q && q.focus(); }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id==='fq'){ F.q = e.target.value; updateResults(); }
  else if (id==='fmin'){ F.min = Math.min(+e.target.value, F.max); e.target.value = F.min; updateResults(); }
  else if (id==='fmax'){ F.max = Math.max(+e.target.value, F.min); e.target.value = F.max; updateResults(); }
  else if (id==='mq'){ ui.mapQ = e.target.value; const pos = e.target.selectionStart; render(); const m = document.getElementById('mq'); m.focus(); m.setSelectionRange(pos,pos); }
  else if (id==='sales') updateCalc();
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id==='fdate'){ F.date = e.target.value; updateResults(); }
  else if (id==='ftime'){ F.time = e.target.value; updateResults(); }
  else if (id==='fpers'){ F.persons = +e.target.value; updateResults(); }
  else if (id==='fred'){ F.onlyRedeem = e.target.checked; updateResults(); }
  else if (id==='fnew'){ F.onlyNew = e.target.checked; updateResults(); }
  else if (id==='fsort'){ F.sort = e.target.value; updateResults(); }
  else if (e.target.name==='pay'){ draft.paid = e.target.value; openSheet(sBook()); }
});

render();
})();
</script>
